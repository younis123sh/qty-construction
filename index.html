<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>حصر كميات وتحليل أسعار QOB</title>
<style>
:root{box-sizing:border-box;--hdr:#212529;--navy:#0f766e;--navy2:#0d9488;--gold2:#24aea6;--gold:#0f766e;--head:#0b5f5a;--bg:#edf4f3;--card:#ffffff;--field:#ffffff;--ink:#14191c;--mut:#4a5b5f;--line:#cbdcd9;--warn:#e2f4f1;--mrow:#d3efeb;--mrowInk:#07443f;--bad:#b42318;--sh:0 4px 14px rgba(20,30,32,.10);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hdr:#15181a;--navy:#17958b;--navy2:#24aea6;--gold2:#24aea6;--gold:#24aea6;--head:#7fded5;--bg:#101315;--card:#1b1f22;--field:#101315;--ink:#e7f2f1;--mut:#9db3b1;--line:#2c3a3c;--warn:#15302e;--mrow:#143f3b;--mrowInk:#c7f3ee;--bad:#f08a80;--sh:0 4px 14px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--hdr:#15181a;--navy:#17958b;--navy2:#24aea6;--gold2:#24aea6;--gold:#24aea6;--head:#7fded5;--bg:#101315;--card:#1b1f22;--field:#101315;--ink:#e7f2f1;--mut:#9db3b1;--line:#2c3a3c;--warn:#15302e;--mrow:#143f3b;--mrowInk:#c7f3ee;--bad:#f08a80;--sh:0 4px 14px rgba(0,0,0,.45);color-scheme:dark}
*{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hdr);color:#fff;z-index:5;border-bottom:3px solid var(--gold2)}
h1{font-size:18px;margin:0;padding:12px 16px 6px;font-weight:700}
header nav{display:flex;overflow-x:auto;gap:8px;padding:0 12px 10px}
header nav:empty{display:none}
header nav button{flex:none;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:20px;padding:6px 14px;font-size:14px}
header nav button.on{background:var(--gold2);color:var(--navy);border-color:var(--gold2);font-weight:700}
main{padding:14px;max-width:860px;margin:0 auto}
main nav{display:flex;overflow-x:auto;gap:8px;margin:6px 0 12px}
main nav button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px 5px 10px;font-size:13px}
main nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main nav button.on .mi{background:var(--hdr)!important}
.hero{text-align:center;padding:22px 10px 6px}
.hero h2{margin:0 0 8px;font-size:24px;color:var(--head)}
.hero p{margin:0;color:var(--mut);font-size:13px;line-height:1.9}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.opt{border:0;background:var(--card);border-radius:14px;padding:14px 6px;box-shadow:var(--sh);color:var(--ink);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:140px;justify-content:center;border-top:4px solid var(--navy)}
.opt:nth-child(2){border-top-color:var(--gold)}
.opt:nth-child(3){border-top-color:var(--navy2)}
.opt .ic{width:48px;height:48px;border-radius:12px;background:var(--navy);display:flex;align-items:center;justify-content:center}
.opt:nth-child(2) .ic{background:var(--gold)}
.opt:nth-child(3) .ic{background:var(--navy2)}
.opt .ic svg,.mi svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;flex:none}
.opt b{font-size:14px;line-height:1.5}
.opt small{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card>b:first-child{display:block;font-size:16px;color:var(--head);margin-bottom:6px}
.tools>b{color:var(--head);font-size:16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
label.chk{flex-direction:row;align-items:center;color:var(--ink);font-size:14px;gap:10px;margin:8px 0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:15px;box-sizing:border-box;outline:none}
input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(38,55,106,.18)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy)}
.res{margin-top:10px;font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--head);font-weight:600}
button{font-family:inherit;cursor:pointer}
.btn,.ghost,.del{font-size:14px;border-radius:12px;padding:9px 14px}
.btn{border:0;background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(27,37,64,.25)}
.btn:active{transform:translateY(1px)}
.ghost{border:1px solid var(--navy);background:var(--card);color:var(--head)}
.del{border:1px solid #e3b7b0;background:var(--card);color:var(--bad)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
th{background:var(--hdr);color:#fff;padding:8px 6px;font-weight:700}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
td.r,th.r{text-align:right}
tr.mrow td{background:var(--mrow);font-weight:700;color:var(--mrowInk)}
.note{font-size:13px;background:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;border-right:4px solid var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.ok{color:var(--ok,#1e7b45)}.warn{color:var(--bad)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;box-shadow:var(--sh);z-index:20}
.tag{display:inline-block;background:#d3efeb;color:#07443f;border-radius:8px;padding:0 8px;font-size:11px;margin-inline-start:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.pa-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}
.pa-kpi{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--navy);border-radius:12px;padding:10px}
.pa-kpi.hi{background:var(--mrow);border-right-color:var(--gold2)}
.pa-kpi small{display:block;font-size:11px;color:var(--mut)}
.pa-kpi b{font-size:15px;color:var(--head)}
.pa-pill{display:inline-block;background:var(--mrow);color:var(--mrowInk);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700}
.pa-info{display:inline-block;background:var(--warn);color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700}
.pa-inp{width:78px!important;padding:6px!important;text-align:center;font-size:13px!important}
.pa-sel{padding:6px!important;font-size:12px!important;max-width:230px}
.opts{grid-template-columns:repeat(2,1fr)}
@media(min-width:600px){.opts{grid-template-columns:repeat(4,1fr)}}

.ai-box{background:var(--card);border:2px solid var(--navy2);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
.ai-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ai-row input{flex:1;min-width:180px}
.ai-mic{background:var(--navy2);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:15px}
.ai-mic.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.aud-item{padding:8px 10px;border-radius:10px;margin:6px 0;font-size:13px;border-right:4px solid var(--navy);background:var(--bg)}
.aud-item.warn{border-right-color:#d97706;background:#fffbeb;color:#78350f}
.aud-item.bad{border-right-color:var(--bad);background:#fef2f2;color:#7f1d1d}
.aud-item.ok{border-right-color:#0f766e;background:var(--warn);color:var(--mrowInk)}
:root[data-theme="dark"] .aud-item.warn{background:#2d2208;color:#fde68a}
:root[data-theme="dark"] .aud-item.bad{background:#2d1215;color:#fecaca}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aud-item.warn{background:#2d2208;color:#fde68a}:root:not([data-theme="light"]) .aud-item.bad{background:#2d1215;color:#fecaca}}
.sc-diff-pos{color:var(--bad);font-weight:700}
.sc-diff-neg{color:#0f766e;font-weight:700}
</style>
</head>
<body>
<header><h1>حصر كميات وتحليل أسعار QOB</h1><nav id="nav"></nav></header>
<main id="main"></main>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/*ENGINE*/
const DEF={wst:2.5,screed:0.05,steel:7850,waste:10,lap:20,bag:0.0354,dry:1.5,dm:1.2,lean:0.1,ov:0.1,blen:0.4,
 mixRS:'1:2:3',mixR:[1,2,3],mixPS:'1:2:4',mixP:[1,2,4],mixJS:'1:4:2',mixJ:[1,4,2],mixM:[1,3],
 thk:1.5,paint:0.35,coats:2,adh:0.075,blk:12.5,wm:0.125,pi:3.14,dest:'download'};
const MIX={'1:2:3':[1,2,3],'1:2:4':[1,2,4],'1.5:2:3':[1.5,2,3],'1:4:2':[1,4,2]};
const TT=['برسلان','سراميك','موازيك'],SUB=['أرضيات','جدران','متر طولي'];
const SZ={'أرضيات':['60x60','30x30','50x50','25x25'],'جدران':['30x60','15x60','60x120'],'متر طولي':['10','15','20']};
const DSZ={'أرضيات':'60x60','جدران':'30x60','متر طولي':'10'};
const DTY={'أرضيات':'برسلان','جدران':'سراميك','متر طولي':'سراميك'};
const KC=['foot','sfoot','sh','col','neck','beam','slab','rib','rib2'];
const MODS=['foot','sfoot','sh','raft','col','neck','beam','slab','sbeam','rib','rib2','exc','bf','kur','jaam','wall','stwall','ext','rasif','rm','skirt','op'];
const PDEF=()=>({dig:{on:false,h:1},ded:{fp:false,fr:false,nk:false,bm:false,rp:false,rr:false},extWin:false,extDedM:0,wdx:{pw:false,pdw:false,tw:false}});
const RT=['برسلان','سراميك','موازيك'],RSF=['60x60','30x30','50x50','25x25'],RSW=['30x60','15x60','60x120'];
const MAIN=[{k:'mHfr',t:'الحفر والردم',subs:['exc','bf']},{k:'mBld',t:'بنود البناء',subs:['kur','jaam','wall','stwall']},{k:'mCon',t:'أعمال الخرسانات',subs:['gFound','beam','gCol','gSlab']},{k:'mExt',t:'التشطيبات الخارجية',subs:['ext','rasif']},{k:'mInt',t:'التشطيبات الداخلية',subs:['rm','fpw','fpc','fdw','fdc','ftf','ftw','fsc','fsk']},{k:'mOpn',t:'النوافذ والأبواب',subs:['op']}];
const DEF_MAINS=()=>{const o={};MAIN.forEach(m=>o[m.k]=true);return o};
const SF=[['B','الطول م'],['C','العرض م'],['D','الارتفاع م'],['E','العدد/طويل'],['F','الأشاير م'],['G','عدد الأسياخ'],['H','قطر الطولي مم'],['I','كانات/م'],['J','قطر الكانة مم']];
const FF=[['n','العدد'],['A','مساحة م²'],['L','طول م'],['W','عرض م'],['P','محيط م'],['H','ارتفاع م'],['dd','خصم م²'],['ad','إضافة م²']];
const VOL=[['B','الطول م'],['C','العرض م'],['D','الارتفاع/العمق م'],['n','العدد']];
const RIBF=[['B','الطول م (اتجاه الأعصاب)'],['C','العرض م'],['D','الارتفاع الكلي م'],['t','سماكة الطبقة م'],['s','تباعد الأعصاب م'],['bw','عرض العصب م'],['n','العدد'],['nb','أسياخ سفلية/عصب'],['db','قطر السفلي مم'],['nt','أسياخ علوية/عصب'],['dt','قطر العلوي مم'],['ks','كانات/م للعصب'],['ds','قطر الكانة مم'],['mv','شبكة طولي/م'],['mh','شبكة عرضي/م'],['dm','قطر الشبكة مم']];
const MOD={
 foot:{t:'القواعد المفردة',f:[['B','الطول م'],['C','العرض م'],['D','الارتفاع م'],['E','طويل/م'],['F','قصير/م'],['G','كوابيل طويل'],['H','كوابيل قصير'],['I','قطر مم'],['J','عدد القواعد']],z:{J:1}},
 sfoot:{t:'القواعد المشتركة',f:[['B','الطول م'],['C','العرض م'],['D','الارتفاع م'],['n','العدد'],['a','علوي طويل/م'],['b','علوي قصير/م'],['c','سفلي طويل/م'],['d','سفلي قصير/م'],['H','قطر رئيسي مم'],['G','قطر علوي قصير مم']],z:{n:1}},
 col:{t:'الأعمدة',f:SF,z:{E:1}},
 neck:{t:'الرقاب',f:SF,z:{E:1}},
 beam:{t:'الجسور (الميدة)',f:[['C','العمق م'],['D','العرض م'],['E','الطول م'],['M','خصم م'],['F','قطر الطولي مم'],['G','أسياخ علوي'],['H','أسياخ سفلي'],['I','إضافي'],['L','قطر الكانة مم'],['J','كانات ركائز/م'],['K','كانات وسط/م']],z:{E:1}},
 exc:{t:'الحفر',f:VOL,z:{n:1}},
 bf:{t:'الردم',f:[...VOL,['dd','خصم م³']],z:{n:1}},
 kur:{t:'الكرسي الحجري',f:VOL,z:{n:1}},
 jaam:{t:'الجعم',f:[...VOL,['rp','نسبة الجعم %']],z:{n:1,rp:70}},
 wall:{t:'بناء البلك',f:[['L','الطول م'],['H','الارتفاع م'],['A','مساحة مباشرة م²'],['n','العدد'],['op','فتحات م²']],z:{n:1}},
 slab:{t:'السقف المصمت',f:[['B','الطول م'],['C','العرض م'],['D','السماكة م'],['n','العدد'],['V','طولي/م'],['H','عرضي/م'],['G','القطر مم']],z:{n:1}},
 rib:{t:'البلاطة الهردي (الأعصاب)',f:RIBF,z:{n:1,s:0.5,bw:0.1,t:0.05,D:0.25,nb:2,db:12,nt:2,dt:10,ks:6,ds:8,mv:5,mh:5,dm:8}},
 pl:{t:'التلابيس الاسمنتية',f:FF,z:{n:1,tk:1.5},sel:[['tk','السماكة سم',()=>['1','1.5','2']]],g:[['pl','التلابيس م²']]},
 tl:{t:'البلاط',f:FF,z:{n:1,ty:'برسلان',sub:'أرضيات',sz:'60x60'},sel:[['ty','النوع',()=>TT],['sub','الاستخدام',()=>SUB],['sz','المقاس سم',x=>SZ[x.sub]||SZ['أرضيات']]],g:[['tf','أرضيات م²'],['tw','جدران م²'],['tm','متر طولي م.ط']]},
 stwall:{t:'بناء الحجر',f:[['L','الطول م'],['H','الارتفاع م'],['T','السماكة م'],['A','مساحة مباشرة م²'],['n','العدد'],['op','فتحات م²']],z:{n:1}},
 skirt:{t:'النعلة',f:[['L','الطول م'],['n','العدد'],['H','ارتفاع النعلة سم']],z:{n:1,H:10}},
 op:{t:'النوافذ والأبواب',f:[['W','العرض م'],['H','الارتفاع م'],['n','العدد']],z:{n:1},sel:[['ty','النوع',()=>['نافذة','باب']]]},
 pt:{t:'الدهانات',f:FF,z:{n:1},g:[['pt','الدهانات م²']]}
};
const NOTE={sfoot:'الأعداد لكل متر. السفلي الطويل يُحسب على العرض، والقصير على الطول.',beam:'التراكب يُطبَّق على الطولي. الكانات بالمحيط.',slab:'تسليح بلاطة مصمتة: الطولي والعرضي مع التراكب.',rib:'عدد الأعصاب = سقف(العرض ÷ التباعد). البلوك = الطول × (التباعد − عرض العصب).',exc:'حفر القواعد = (الخرسانة العادية ÷ سماكة الخرسانة العادية) × ارتفاع الحفر، وحفر يدوي اختياري.',stwall:'بناء الحجر: المساحة = الطول × الارتفاع − الفتحات، والحجم = المساحة × السماكة. الملاط غير مضاف بعد.',skirt:'النعلة بالمتر الطولي = الطول × العدد.',op:'عدد النوافذ والأبواب ومساحتها. لم تُخصم من الجدران بعد.',bf:'الردم = الحفر الكلي − الخصومات المؤكدة.',kur:'حجم الكرسي الحجري = الطول × العرض × الارتفاع.',jaam:'الجعم = الحجم × نسبته. الباقي خرسانة بنسبة الخلط المختارة.',wall:'الطوب والملاط حسب الإعدادات.',pl:'اختر السماكة لكل بند.',tl:'الاستخدام: أرضيات أو جدران بالمتر المربع، أو متر طولي (الطول أو المحيط، والمقاس = ارتفاع الشريط بالسم).',pt:'الدهان بالكيلوغرام حسب الإعدادات.'};
const RL={plain:'عادية م³',rein:'مسلحة م³',steel:'حديد صافي طن',exc:'حفر م³',cnt:'عدد',back:'ردم م³',kur:'كرسي م³',jaam:'جعم م³',jcon:'خرسانة الجعم م³',area:'م²',vol:'حجم م³',lin:'م.ط'};
let S=clone(DEF),D={},CUR={v:'home',m:null,s:null,pid:null,fin:false,started:false};
function clone(o){return JSON.parse(JSON.stringify(o))}
function blank(){const o=Object.assign({gf:{},proj:{name:'',type:'',owner:'',engineer:'',start:'',mains:DEF_MAINS()},px:{}},PDEF());MODS.forEach(k=>o[k]=[]);return o}
const up=x=>Math.ceil(x-1e-9);
const WF=()=>1+S.waste/100,LF=()=>1+S.lap/100;
const w=d=>d*d*S.pi*S.steel/4/1e9;
const ta=s=>{const[a,b]=s.split('x').map(Number);return a*b/1e4};
function mix(v,dry,r){const t=r[0]+r[1]+r[2],f=dry*WF()/t,B=S.bag;return{c:up(v*f*r[0]/B),s:up(v*f*r[1]),g:up(v*f*r[2])}}
function fbase(x){return x.A>0?x.A:(x.L*x.W>0?x.L*x.W:x.P*x.H)}

function bmFoot(x){return x.D*(x.E-x.M)*(x.n||1)}
function bmRein(x){return x.C*x.D*(x.E-x.M)*(x.n||1)}
function bmSteel(x){const Ln=x.E-x.M,n=x.n||1;return n*(Ln*(x.G+x.H)*LF()*w(x.F)+x.I*(Ln+0.828*x.C)*w(x.F)+2*(x.D+x.C)*(x.K*Ln*0.5+x.J*Ln*0.5)*w(x.L))}
function calc(k,x){const LX=LF();
 switch(k){
 case 'beam':{const Ln=x.E-x.M,C=x.C,Dd=x.D;return{plain:0,rein:C*Dd*Ln,steel:Ln*(x.G+x.H)*LX*w(x.F)+x.I*(Ln+0.828*C)*w(x.F)+2*(Dd+C)*(x.K*Ln*0.5+x.J*Ln*0.5)*w(x.L)}}
 case 'sh':{const B=x.B,C=x.C,h=x.D,n=x.n;return{plain:B*(C+2*S.ov)*S.lean*n,rein:B*C*h*n,steel:n*(B*LX*(x.Gt*w(x.dt)+x.Gb*w(x.db))+x.ks*B*2*(C+h)*w(x.ds))}}
 case 'slab':case 'rib':case 'rib2':return{plain:0,rein:x.B*x.C*x.D*x.n,steel:0};
 case 'sbeam':return{plain:0,rein:bmRein(x),steel:bmSteel(x)};
 case 'hb1':case 'hb2':return{plain:0,rein:x.b*x.L*x.D*x.n,steel:x.n*(x.L*LX*(x.Gt*w(x.dt)+x.Gb*w(x.db))+x.ks*x.L*2*(x.b+x.D)*w(x.ds))};
 case 'ext':{const b=(x.A>0?x.A:x.P*x.H)*x.n;return{plain:0,rein:0,steel:0,pl:x.pl?b:0,pt:x.pt?b:0}}
 case 'rasif':return{plain:0,rein:0,steel:0,lin:x.u==='م.ط'?x.L*x.n:0,area:x.u==='م²'?x.L*x.W*x.n:0};
 case 'skirt':{const lin=Math.max(0,x.L-(x.dw||0))*x.n;return{plain:0,rein:0,steel:0,lin,area:lin*(x.H||0)/100}}
 case 'raft':{const A=x.B*x.C,n=x.n||1;return{plain:(x.B+2*S.ov)*(x.C+2*S.ov)*S.lean*n,rein:A*x.D*n,steel:n*LX*A*((x.bx+x.by)*w(x.db)+(x.tx+x.ty)*w(x.dt))}}
 case 'rm':{const P=x.P>0?x.P:2*(x.L+x.W),FA=(x.A>0?x.A:x.L*x.W)*x.n;return{plain:0,rein:0,steel:0,area:FA+Math.max(0,P*x.H*x.n-(x.dd||0))}}
 default:return calcOld(k,x);
 }}
function calcOld(k,x){const r={plain:0,rein:0,steel:0};
 switch(k){
 case 'foot':{const B=x.B,C=x.C,h=x.D,E=x.E,F=x.F,G=x.G,H=x.H,I=x.I,J=x.J;
  r.plain=(B+2*S.ov)*(C+2*S.ov)*S.lean*J;r.rein=B*C*h*J;
  r.steel=((2*h+B)*E*C+(2*h+C)*F*B+(3*B+2*h)*G+(3*C+2*h)*H)*J*w(I);break}
 case 'sfoot':{const B=x.B,C=x.C,h=x.D,n=x.n;
  r.plain=(B+2*S.ov)*(C+2*S.ov)*S.lean*n;r.rein=B*C*h*n;
  r.steel=n*((x.c*C*B+x.d*B*C+x.a*C*B)*w(x.H)+x.b*B*C*w(x.G));break}
 case 'col':case 'neck':{const B=x.B,C=x.C,h=x.D,E=x.E;
  r.rein=B*C*h*E;r.steel=E*(x.F+h)*x.G*w(x.H)+2*(B+C)*h*x.I*E*w(x.J);break}
 case 'beam':{const Hd=x.C,W=x.D,Ln=x.E,Ded=x.M,n=Hd*W*(Ln-Ded);
  r.rein=n;r.steel=Ln*(x.G+x.I+x.H)*LF()*w(x.F)+2*(W+Hd)*(x.K*(Ln-Ded)*.5+x.J*(Ln-Ded)*.5)*w(x.L);break}
 case 'exc':r.exc=x.B*x.C*x.D*x.n;break;
 case 'stwall':{const base=x.A>0?x.A:x.L*x.H;const a=Math.max(0,base*x.n-(x.op||0));r.area=a;r.vol=a*x.T;break}
 case 'skirt':r.lin=x.L*x.n;r.area=r.lin*x.H/100;break;
 case 'op':r.cnt=x.n;r.area=x.W*x.H*x.n;break;
 case 'bf':r.back=Math.max(0,x.B*x.C*x.D*x.n-(x.dd||0));break;
 case 'kur':r.kur=x.B*x.C*x.D*x.n;break;
 case 'jaam':{const v=x.B*x.C*x.D*x.n;r.jaam=v*x.rp/100;r.jcon=v*(100-x.rp)/100;break}
 case 'wall':r.area=Math.max(0,(x.A>0?x.A:x.L*x.H)*x.n-(x.op||0));break;
 case 'slab':r.rein=x.B*x.C*x.D*x.n;r.steel=(x.V*x.C*x.B+x.H*x.B*x.C)*x.n*w(x.G)*LF();break;
 case 'rib':{const L=x.B,n=x.n,hr=x.D-x.t,sp=Math.max(x.s,0.01),N=Math.ceil(x.C/sp),lf=LF();
  r.rein=(N*x.bw*hr*L+x.C*L*x.t)*n;
  r.steel=n*(N*(x.nb*w(x.db)+x.nt*w(x.dt))*L*lf+N*x.ks*L*2*(x.bw+hr)*w(x.ds)+(x.mv+x.mh)*L*x.C*w(x.dm)*lf);
  r.blk=Math.ceil(Math.max(0,L*x.C-N*x.bw*L)*WF()/(S.blen*Math.max(0.01,sp-x.bw)))*n;break}
 case 'pl':r.area=fitem(x);r.vol=r.area*(x.tk||1.5)/100;break;
 case 'pt':r.area=fitem(x);break;
 case 'tl':if(x.sub==='متر طولي')r.lin=Math.max(0,(x.L||x.P||0)*(x.n||1)-(x.dd||0)+(x.ad||0));else r.area=fitem(x);break;
 }return r}
function sumK(ks,f){let s=0;ks.forEach(k=>(D[k]||[]).forEach(x=>s+=calc(k,x)[f]||0));return s}
function ms(k){const r={plain:0,rein:0,steel:0,exc:0,kur:0,jaam:0,jcon:0,area:0,vol:0,cnt:0,lin:0,pl:0,pt:0};(D[k]||[]).forEach(x=>{const c=calc(k,x);for(const f in c)r[f]=(r[f]||0)+(c[f]||0)});return r}
function winArea(){return (D.op||[]).filter(x=>x.ty==='نافذة').reduce((s,x)=>s+x.W*x.H*x.n,0)}
function digVal(){return D.dig.on?(sumK(['foot','sfoot'],'plain')/Math.max(S.lean,0.001))*(D.dig.h||0):0}
function DEDV(){return{fp:sumK(['foot','sfoot'],'plain'),fr:sumK(['foot','sfoot'],'rein'),nk:sumK(['neck'],'rein'),bm:sumK(['beam'],'rein'),rp:sumK(['raft'],'plain'),rr:sumK(['raft'],'rein')}}
function dedSum(){const v=DEDV();return ['fp','fr','nk','bm','rp','rr'].reduce((s,k)=>s+(D.ded[k]?v[k]:0),0)}
function secCalc(kind){
 const isSlab=kind==='slab',two=kind==='rib2';
 const want=isSlab?'عادية':(two?'هردي باتجاهين':'هردي باتجاه واحد');
 const panels=D[kind]||[];
 const beams=(D.sbeam||[]).filter(x=>(x.ty||'عادية')===want&&x.E!==undefined);
 const gross=panels.reduce((s,x)=>s+x.B*x.C*x.n,0),foot=beams.reduce((s,x)=>s+bmFoot(x),0);
 const An=Math.max(0,gross-foot),f=gross>0?An/gross:0;
 const bR=beams.reduce((s,x)=>s+bmRein(x),0),bS=beams.reduce((s,x)=>s+bmSteel(x),0);
 let rein0=0,steel0=0,blk=0;
 if(isSlab){
  rein0=panels.reduce((s,x)=>s+x.B*x.C*x.n*x.D,0)-beams.reduce((s,x)=>s+bmFoot(x)*(x.t||0),0);
  steel0=panels.reduce((s,x)=>s+(x.V*x.C+x.H*x.B)*x.n*w(x.G)*LF(),0)*f;
 }else{
  panels.forEach(x=>{
   const hr=x.D-x.t;
   if(!two){
    const N=Math.ceil(x.C/Math.max(x.s,0.01)),plan=N*x.bw*x.B*x.n;
    rein0+=N*x.bw*hr*x.B*x.n*f+x.B*x.C*x.n*x.t*f;
    const pk=Math.max(0,(x.B*x.C*x.n-plan)*f);
    blk+=Math.ceil(pk*WF()/(S.blen*Math.max(0.01,x.s-x.bw))-1e-9);
    steel0+=(N*(x.nb*w(x.db)+x.nt*w(x.dt))*x.B*LF()+N*x.ks*x.B*2*(x.bw+hr)*w(x.ds))*x.n*f+(x.mv+x.mh)*x.B*x.C*w(x.dm)*LF()*x.n*f;
   }else{
    const Nx=Math.ceil(x.B/Math.max(x.sx,0.01)),Ny=Math.ceil(x.C/Math.max(x.sy,0.01));
    const plan=x.bw*(Ny*x.B+Nx*x.C-Nx*Ny*x.bw);
    rein0+=plan*hr*x.n*f+x.B*x.C*x.n*x.t*f;
    const pk=Math.max(0,(x.B*x.C*x.n-plan*x.n)*f);
    blk+=Math.ceil(pk*WF()/(Math.max(0.01,x.sx-x.bw)*Math.max(0.01,x.sy-x.bw))-1e-9);
    const len=Ny*x.B+Nx*x.C;
    steel0+=len*(x.nb*w(x.db)+x.nt*w(x.dt))*LF()*x.n*f+len*x.ks*2*(x.bw+hr)*w(x.ds)*x.n*f+(x.mv+x.mh)*x.B*x.C*w(x.dm)*LF()*x.n*f;
   }
  });
 }
 return{rein:rein0+bR,steel:steel0+bS,blk,rein0,steel0,bR,bS};
}
function extAgg(){let pl=0,pt=0;(D.ext||[]).forEach(x=>{const b=(x.A>0?x.A:x.P*x.H)*x.n;if(x.pl)pl+=b;if(x.pt)pt+=b});const ded=(D.extWin?winArea():0)+(D.extDedM||0);return{pl:Math.max(0,pl-ded),pt:Math.max(0,pt-ded)}}

 if(!CLOUD_USER||!DB||!navigator.onLine||SYNC_BUSY)return;
 SYNC_BUSY=true;const uid=CLOUD_USER.uid;
 try{
  const ref=DB.collection('users').doc(uid).collection('projects');
  const snap=await ref.get();const remote=new Map();snap.forEach(doc=>remote.set(doc.id,{...doc.data(),id:doc.id}));
  const hid=new Set(loadHidden()),dead=new Set();for(const [id,r] of [...remote]){if(r.deleted)dead.add(id)}for(const id of dead)remote.delete(id);for(const id of hid)remote.delete(id);const local=loadDrafts().filter(r=>!r.auto&&!dead.has(r.id)&&!hid.has(r.id)),merged=new Map();
  // Merge by project ID; the newest revision wins. Local copies remain available offline.
  for(const [id,r] of remote)merged.set(id,r);
  for(const r of local){const old=merged.get(r.id);if(!old||recTime(r)>recTime(old))merged.set(r.id,r)}
  const batch=DB.batch();let writes=0;
  for(const [id,r] of merged){const old=remote.get(id);if(!old||recTime(r)>recTime(old)){batch.set(ref.doc(id),{...r,ownerUid:uid,updatedAt:recTime(r)||Date.now()},{merge:true});writes++}}
  if(writes)await batch.commit();
  const mergedList=[...merged.values()].sort((a,b)=>recTime(a)-recTime(b));saveDrafts([...mergedList,...loadDrafts().filter(r=>r.auto)]);
  if(showToast)toast('اكتملت المزامنة: '+mergedList.length+' مشروع');
  if(CUR.v==='drafts'||CUR.v==='home')render();
 }catch(e){console.error(e);if(showToast)toast('تعذرت المزامنة؛ بياناتك المحلية لم تتأثر')}
 finally{SYNC_BUSY=false}
}

async function saveBlob(blob,name){const dest=S.dest||'download';let fb=false;
 try{
  if(dest==='share'&&navigator.canShare){const file=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('تمت المشاركة');return}fb=true}
  else if(dest==='pick'&&window.showSaveFilePicker){const hd=await showSaveFilePicker({suggestedName:name});const wr=await hd.createWritable();await wr.write(blob);await wr.close();toast('تم الحفظ في المكان المحدد');return}
 }catch(e){if(e&&e.name==='AbortError'){toast('أُلغي الحفظ');return}fb=true}
 const cl=window.claude;
 if(!cl){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(fb?'الخيار المحدد غير متاح هنا، تم التنزيل إلى الهاتف':'تم التنزيل إلى الهاتف');return}
 const dl=await cl.use('downloads');if(!dl){toast('التصدير غير متاح في هذه النسخة');return}

async function exportXlsx(){const P=D.proj,R=boq(),T=totals(),wb=XLSX.utils.book_new();
 const A=[['اسم المشروع',P.name],['نوع المشروع',P.type],['مهندس الحصر',P.engineer||''],['المالك',P.owner],['تاريخ البدء',P.start],[],['الرقم','البند','الوحدة','الكمية','سعر الوحدة','الإجمالي']],F=[],tots=[];let ms0=0;
 R.forEach(r=>{const i=A.length;
  if(r.t==='main'){A.push([r.n,r.l,'','','','']);ms0=i}
  else if(r.t==='sub')A.push(['',r.l,'','','','']);
  else if(r.t==='line'){A.push([r.n,r.l,r.u,+r.q.toFixed(3),r.p,0]);F.push({r:i,c:5,f:`D${i+1}*E${i+1}`,v:r.amt})}
  else if(r.t==='tot'){A.push(['',r.l,'','','',0]);F.push({r:i,c:5,f:`SUM(F${ms0+2}:F${i})`,v:r.amt});tots.push('F'+(i+1))}
  else{A.push(['',r.l,'','','',0]);F.push({r:i,c:5,f:'SUM('+tots.join(',')+')',v:r.amt})}});
 const ws=XLSX.utils.aoa_to_sheet(A);
 F.forEach(({r,c,f,v})=>{ws[XLSX.utils.encode_cell({r,c})]={t:'n',v,f}});
 ws['!cols']=[{wch:6},{wch:46},{wch:8},{wch:12},{wch:12},{wch:14}];ws['!views']=[{RTL:true}];
 XLSX.utils.book_append_sheet(wb,ws,'جدول الكميات');
 const wm=XLSX.utils.aoa_to_sheet([['المادة','الوحدة','الكمية'],...matsRows(T)]);wm['!views']=[{RTL:true}];XLSX.utils.book_append_sheet(wb,wm,'المواد');
 MODS.filter(k=>k!=='skirt').forEach(k=>{const s=XLSX.utils.aoa_to_sheet([['الاسم',...MOD[k].f.map(f=>f[1]),...(MOD[k].sel||[]).map(x=>x[1]),'النتائج'],...D[k].map(x=>[x.name,...MOD[k].f.map(([q])=>x[q]??0),...(MOD[k].sel||[]).map(([q])=>x[q]),resTxt(k,x)])]);s['!views']=[{RTL:true}];XLSX.utils.book_append_sheet(wb,s,MOD[k].t)});
 wb.Workbook={CalcPr:{fullCalcOnLoad:true}};
 await saveBlob(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'حصر-الكميات.xlsx');
}
async function exportPdf(){

 const T=totals(),el=document.createElement('div'),P=D.proj;
 el.innerHTML=`<h2>تقرير حصر الكميات</h2><p>${esc(P.name)} · ${P.type} · المهندس: ${esc(P.engineer||'')} · المالك: ${esc(P.owner)} · البدء: ${P.start}</p><div class=card><b>جدول الكميات</b>${boqHTML(true)}</div><div class=card><b>المواد</b>${matsHTML(T)}</div><div class=card><b>فحص التكامل</b>${checksHTML(T)}</div>`;

 el.querySelectorAll('.card').forEach(c=>c.style.cssText='background:#fff;color:#000;border:1px solid #bbb;border-radius:6px;padding:6px;margin-bottom:8px');
 document.body.appendChild(el);
 try{const blob=await html2pdf().set({margin:8,filename:'حصر-الكميات.pdf',image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).outputPdf('blob');await saveBlob(blob,'حصر-الكميات.pdf')}
 catch(err){toast('تعذّر إنشاء PDF')}
 finally{el.remove()}
}

function draftsHTML(){const L=loadDrafts();const imp='<label class=ghost style="display:inline-block;cursor:pointer">استيراد مسودة من ملف<input type=file accept=".json,application/json" data-imp=1 style="display:none"></label>';
 let cl='';if(CLOUD_USER){cl=`<div class=card><b>مشاريع السحابة</b><p class=note>المشاريع المحفوظة في حسابك ولا توجد على هذا الجهاز.</p><div class=tools><button class=ghost data-cloud-list=1>تحديث قائمة السحابة</button></div>`+(CLOUD_LIST===null?'':(CLOUD_LIST.length?CLOUD_LIST.map(r=>`<div class=card><b>${esc(r.name||'مشروع بدون اسم')}</b><div class=tools><button class=btn data-cloud-dl="${r.id}">تحميل</button></div></div>`).join(''):'<p class=note>لا توجد مشاريع أخرى في السحابة.</p>'))+'</div>'}
 const head=cloudCard()+cl+`<div class=tools><button class=btn data-new=1>مشروع جديد</button>${imp}</div>`;
 if(!L.length)return head+'<p class=note>لا توجد مسودات محفوظة بعد.</p>';
 return head+L.slice().reverse().map(r=>`<div class=card><b>${esc(r.name||'مشروع بدون اسم')}</b>${r.auto?' <span class=tag>تعديلات غير محفوظة</span>':''}<p>${esc(r.type)}${r.engineer?' · المهندس: '+esc(r.engineer):''} · آخر حفظ: ${r.updated}</p><div class=tools><button class=btn data-open-draft="${r.id}">فتح واستعراض</button><button class=ghost data-dl-draft="${r.id}">تنزيل ملف المسودة</button><button class=ghost data-del-draft="${r.id}">إخفاء من هذا الجهاز</button>${CLOUD_USER?`<button class=del data-cloud-del="${r.id}">حذف من السحابة</button>`:''}</div></div>`).join('')}
function newProject(){D=blank();CUR={v:'proj',m:null,s:null,pid:null,fin:false,started:false};save();render()}
function openDraft(id){const r=loadDrafts().find(x=>x.id===id);if(!r)return;D=Object.assign(blank(),clone(r.D));cleanLegacy();D.proj=Object.assign(blank().proj,D.proj);CUR={v:'items',m:null,s:null,pid:id,fin:false,started:true};save();render()}
function loadHidden(){try{return JSON.parse(localStorage.getItem('qty-hidden')||'[]')}catch(e){return[]}}
function saveHidden(a){try{localStorage.setItem('qty-hidden',JSON.stringify(a))}catch(e){}}
let CLOUD_LIST=null;
function delDraft(id){if(!confirm('إخفاء هذا المشروع من هذا الجهاز فقط؟ يبقى في السحابة إن كان محفوظاً فيها.'))return;saveDrafts(loadDrafts().filter(x=>x.id!==id));saveHidden([...new Set([...loadHidden(),id])]);render()}
async function cloudList(){if(!CLOUD_USER||!DB||!navigator.onLine){toast('يلزم تسجيل الدخول والاتصال بالإنترنت');return}try{const snap=await DB.collection('users').doc(CLOUD_USER.uid).collection('projects').get();const local=new Set(loadDrafts().map(x=>x.id));const out=[];snap.forEach(doc=>{const r={...doc.data(),id:doc.id};if(!r.deleted&&!local.has(doc.id))out.push(r)});CLOUD_LIST=out;render()}catch(e){console.error(e);toast('تعذر جلب قائمة السحابة')}}
function cloudDownload(id){const r=(CLOUD_LIST||[]).find(x=>x.id===id);if(!r)return;const{ownerUid,deleted,deletedAt,...rest}=r;saveDrafts([...loadDrafts(),{...rest,auto:false}]);saveHidden(loadHidden().filter(x=>x!==id));CLOUD_LIST=(CLOUD_LIST||[]).filter(x=>x.id!==id);toast('تم تحميل المشروع من السحابة');render()}
async function cloudDelete(id){if(!CLOUD_USER||!DB||!navigator.onLine){toast('يلزم تسجيل الدخول والاتصال بالإنترنت للحذف من السحابة');return}if(!confirm('حذف هذا المشروع نهائياً من السحابة ومن كل الأجهزة؟'))return;try{await DB.collection('users').doc(CLOUD_USER.uid).collection('projects').doc(id).set({id,deleted:true,deletedAt:Date.now(),updatedAt:Date.now(),D:null},{merge:true});saveDrafts(loadDrafts().filter(x=>x.id!==id));CLOUD_LIST=(CLOUD_LIST||[]).filter(x=>x.id!==id);toast('حُذف المشروع من السحابة');render()}catch(e){console.error(e);toast('تعذر الحذف من السحابة؛ لم يُحذف شيء')}}
let _adT=null;
function autoDraft(){clearTimeout(_adT);_adT=setTimeout(autoDraftNow,600)}
function autoDraftNow(){_adT=null;try{if(['home','drafts','set'].includes(CUR.v))return;const P=D.proj;const hasItems=MODS.some(k=>(D[k]||[]).length>0);if(!(P.name||P.owner||hasItems))return;const L=loadDrafts();const id=CUR.pid||('a'+Date.now());const cur=JSON.stringify(D);const prev=L.find(x=>x.id===id);if(prev&&JSON.stringify(prev.D)===cur)return;CUR.pid=id;const rec=mkRec(id);rec.auto=true;const i=L.findIndex(x=>x.id===id);if(i>=0)L[i]=rec;else L.push(rec);saveDrafts(L)}catch(e){}}
addEventListener('pagehide',()=>{if(_adT){clearTimeout(_adT);autoDraftNow()}});
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&_adT){clearTimeout(_adT);autoDraftNow()}});
function resumeCard(){const a=loadDrafts().filter(r=>r.auto).sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0))[0];if(!a)return '';return `<div class=card><b>متابعة آخر عمل</b><p>${esc(a.name||'مشروع بدون اسم')} — تعديلات لم تُحفظ بعد</p><button class=btn data-open-draft="${a.id}">متابعة المشروع</button></div>`}
function mkRec(id){const P=D.proj;return{id,name:P.name,type:P.type,owner:P.owner,engineer:P.engineer||'',start:P.start,updated:new Date().toISOString().slice(0,10),updatedAt:Date.now(),auto:false,D:clone(D)}}
function saveDraft(kind){if(!D.proj.name){toast('أدخل اسم المشروع أولاً');CUR.v='proj';render();return}
 const L=loadDrafts(),id=CUR.pid||('p'+Date.now()),rec=mkRec(id);const i=L.findIndex(x=>x.id===id);if(i>=0)L[i]=rec;else L.push(rec);
 saveDrafts(L);CUR.pid=id;CUR.fin=false;CUR.started=true;save();
 if(CLOUD_USER&&navigator.onLine)syncCloud(false);
 if(kind==='x')exportXlsx();if(kind==='p')exportPdf();
 toast('تم حفظ المسودة');CUR.v='drafts';render()}
function dlDraft(id){const r=loadDrafts().find(x=>x.id===id);if(!r)return;saveBlob(new Blob([JSON.stringify(r)],{type:'application/json'}),r.name.replace(/[\\/:*?"<>|]/g,'-')+'.json')}
async function importDraft(f){if(!f)return;try{const r=JSON.parse(await f.text());if(!r||!r.D)throw 0;const L=loadDrafts();r.id='p'+Date.now();r.updated=new Date().toISOString().slice(0,10);L.push(r);saveDrafts(L);toast('تم استيراد المسودة');render()}catch(e){toast('الملف غير صالح')}}
document.body.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){CUR.v=t.dataset.tab;render();return}
 if(t.dataset.cloudList!==undefined){cloudList();return}
 if(t.dataset.cloudDl){cloudDownload(t.dataset.cloudDl);return}
 if(t.dataset.cloudDel){cloudDelete(t.dataset.cloudDel);return}
 if(t.dataset.extwin!==undefined){D.extWin=!D.extWin;save();render();return}
 if(t.dataset.gs){const m=t.dataset.gs;CUR.gsG=t.dataset.gg;CUR.gsM=m;render();if(!D[m].length){const b=document.querySelector('[data-act=add][data-m="'+m+'"]');if(b)b.click()}return}
 if(t.dataset.wdx){D.wdx[t.dataset.wdx]=!D.wdx[t.dataset.wdx];save();render();return}
 if(t.dataset.fdel){if(!confirm('إلغاء التأشير لهذا التشطيب؟ سيُحذف صف الغرفة من هذا التشطيب ويُلغى تعديله وخصمه.'))return;const x=D.rm[+t.dataset.i];x[t.dataset.fdel]=false;if(x.ex)delete x.ex[t.dataset.fdel];save();render();return}
 if(t.dataset.freset){const x=D.rm[+t.dataset.i];if(x.ex&&x.ex[t.dataset.freset])delete x.ex[t.dataset.freset].o;save();render();return}
 if(t.dataset.dig!==undefined){D.dig.on=!D.dig.on;save();render();return}
 if(t.dataset.ded){D.ded[t.dataset.ded]=!D.ded[t.dataset.ded];save();render();return}
 if(t.dataset.auth){authAction(t.dataset.auth);return}
 if(t.dataset.cloudSync){syncCloud(true);return}
 if(t.dataset.new){newProject();return}
 if(t.dataset.openDraft!==undefined){openDraft(t.dataset.openDraft);return}
 if(t.dataset.delDraft!==undefined){delDraft(t.dataset.delDraft);return}
 if(t.dataset.dlDraft!==undefined){dlDraft(t.dataset.dlDraft);return}
 if(t.dataset.save){saveDraft(t.dataset.save);return}
 if(t.dataset.fin!==undefined){CUR.fin=t.dataset.fin==='1';render();return}
 if(t.dataset.go){if(!projOK()){toast('أكمل اسم المشروع ونوعه ومالكه أولاً');return}{CUR.started=true;CUR.v='items';render();return}}
 if(t.dataset.open){CUR.m=t.dataset.open;CUR.s=null;render();return}
 if(t.dataset.back){CUR.m=null;render();return}
 if(t.dataset.sub){CUR.s=t.dataset.sub;render();return}
 if(t.dataset.act==='add'){D[t.dataset.m].push(newItem(t.dataset.m));save();render();return}
 if(t.dataset.act==='del'){D[t.dataset.m].splice(+t.dataset.i,1);save();render();return}
 if(t.id==='xl'){exportXlsx();return}
 if(t.id==='pd'){exportPdf();return}
 if(t.id==='df'){S=clone(DEF);save();render();return}
 if(t.id==='cl'){if(confirm('حذف كل البنود؟')){const P=D.proj,g=D.gf,px=D.px;D=blank();D.proj=P;D.gf=g;D.px=px;save();render()}return}
});
function setProj(t){D.proj[t.dataset.pj]=t.value;save();const b=$('#goBtn');if(b)b.disabled=!projOK();const hn=$('#projHint');if(hn)hn.style.display=projOK()?'none':''}
document.body.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f!==undefined&&t.dataset.m==='rm'&&['n','L','W','H','P','A'].includes(t.dataset.f)){const x=D.rm[+t.dataset.i];const ov=Object.keys(x.ex||{}).filter(k=>x[k]&&x.ex[k].o!==undefined&&x.ex[k].o!=='');if(ov.length&&confirm('الغرفة «'+(x.name||'')+'» فيها تعديل يدوي في: '+ov.map(k=>RMLBL[k]).join('، ')+'.\nهل تُحدَّث هذه الصفوف المعدلة لتتبع الأبعاد الجديدة؟\nموافق: تُحدَّث وتُلغى التعديلات اليدوية.\nإلغاء: تبقى الصفوف على تعديلها اليدوي.')){ov.forEach(k=>delete x.ex[k].o)}save();render();return}
 if(t.dataset.cb!==undefined){const x=D[t.dataset.m][+t.dataset.i];if(!t.checked&&t.dataset.m==='rm'&&!confirm('إلغاء تأشير هذه الغرفة لهذا التشطيب؟ سيُحذف صفها من التشطيب وتعديله وخصمه.')){t.checked=true;return}if(!t.checked&&x.ex)delete x.ex[t.dataset.cb];x[t.dataset.cb]=t.checked;save();render();return}
 if(t.dataset.fo!==undefined){exSet(+t.dataset.i,t.dataset.fo,'o',t.value===''?undefined:num(t.value));save();render();return}
 if(t.dataset.fd!==undefined){exSet(+t.dataset.i,t.dataset.fd,'d',num(t.value)||0);save();render();return}
 if(t.dataset.fts!==undefined){exSet(+t.dataset.i,t.dataset.fts,'ty',t.value);save();render();return}
 if(t.dataset.fsz!==undefined){exSet(+t.dataset.i,t.dataset.fsz,'sz',t.value);save();render();return}
 if(t.dataset.pj){setProj(t);return}
 if(t.dataset.mn){D.proj.mains[t.dataset.mn]=t.checked;save();return}
 if(t.dataset.dest){S.dest=t.value;save();return}
 if(t.dataset.imp){importDraft(t.files[0]);t.value='';return}
 if(t.dataset.mx){const k=t.dataset.mx,v=t.value;S['mix'+k+'S']=v;if(MIX[v])S['mix'+k]=clone(MIX[v]);save();render();return}
 if(t.dataset.k){const x=D[t.dataset.m][+t.dataset.i];const q=t.dataset.k;x[q]=q==='tk'?num(t.value):t.value;if(q==='sub')x.sz=DSZ[t.value];save();render()}
});
document.body.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.pj){setProj(t);return}
 if(t.dataset.dh!==undefined){D.dig.h=num(t.value);save();updRes();return}
 if(t.dataset.extm!==undefined){D.extDedM=num(t.value);save();updRes();return}
 if(t.dataset.f!==undefined){D[t.dataset.m][+t.dataset.i][t.dataset.f]=num(t.value);save();updRes();return}
 if(t.dataset.name!==undefined){D[t.dataset.m][+t.dataset.i].name=t.value;save();return}
 if(t.dataset.g){const[g,f]=t.dataset.g.split('.');D.gf[g][f]=num(t.value);save();return}
 if(t.dataset.s){const p=t.dataset.s.split('.'),v=num(t.value);if(p.length===1)S[p[0]]=v;else S[p[0]][+p[1]]=v;save();return}
 if(t.dataset.px!==undefined){const r=boq()[+t.dataset.px];if(r&&r.key){D.px[r.key]=num(t.value);save();updPx()}}
});

function loadPACat() {
  try {
    const s = JSON.parse(localStorage.getItem(PA_CAT_KEY) || 'null');
    if (s && Array.isArray(s.materials) && Array.isArray(s.labor) && Array.isArray(s.mixes)) return s;
  } catch (e) {}
  return clone(PA_CAT_DEF);
}
function savePACat() {
  try { localStorage.setItem(PA_CAT_KEY, JSON.stringify(PA_CAT)); } catch (e) {}
}
function loadPAPresets() {
  try {
    const s = JSON.parse(localStorage.getItem(PA_PRESETS_KEY) || '[]');
    if (Array.isArray(s)) return s;
  } catch (e) {}
  return [];
}
function savePAPresets() {
  try { localStorage.setItem(PA_PRESETS_KEY, JSON.stringify(PA_PRESETS)); } catch (e) {}
}

function ensurePA() {
  if (!D.paSet) D.paSet = clone(PA_PSET_DEF);
  else D.paSet = Object.assign(clone(PA_PSET_DEF), D.paSet);
  if (!D.pa) D.pa = {};
}

function paResInfo(code) {
  const m = PA_CAT.materials.find(x => x.code === code);
  if (m) return { label: m.group + ' — ' + m.spec, unit: m.unit, price: +m.price || 0, isMat: true };
  const l = PA_CAT.labor.find(x => x.code === code);
  if (l) return { label: l.spec, unit: l.unit, price: +l.price || 0, isMat: false };
  return { label: code, unit: '-', price: 0, isMat: false };
}

function paMix(ratio) {
  return PA_CAT.mixes.find(x => x.ratio === ratio) || PA_CAT.mixes[0];
}

// Check if a BOQ line is informational-only (no price, avoids double-counting)
function isInfoLine(x) {
  const l = x.l || '', u = x.u || '';
  if (l.includes('حديد تسليح')) return true; // مدمج داخل سعر م³ الخرسانة المسلحة
  if (l.includes('بلك (شامل')) return true; // مدمج داخل سعر م² بناء جدران البلك
  if (l.includes('حجر بناء (حجم)')) return true; // مدمج داخل سعر م² بناء الحجر
  if (l.includes('نوافذ (عدد)')) return true; // تُسعّر النوافذ بالمتر المربع
  if (l.includes('أبواب (مساحة)')) return true; // تُسعّر الأبواب بالعدد
  return false;
}

// Calculate actual steel ratio (ton per m³) from the project's takeoff for each reinforced concrete line
function actualSteelRatio(line) {
  const T = totals(), W = 1 + (S.wst ?? 2.5) / 100;
  const l = line.l || '', k = line.key || '';
  const ratio = (st, conc, def) => (conc > 0 && st > 0) ? +(st * W / conc).toFixed(4) : def;
  if (k.startsWith('القواعد المفردة')) { const M = ms('foot'); return ratio(M.steel, M.rein, 0.085); }
  if (k.startsWith('القواعد المشتركة')) { const M = ms('sfoot'); return ratio(M.steel, M.rein, 0.10); }
  if (k.startsWith('الشدادات')) { const M = ms('sh'); return ratio(M.steel, M.rein, 0.12); }
  if (k.startsWith('الحصيرة')) { const M = ms('raft'); return ratio(M.steel, M.rein, 0.11); }
  if (k.startsWith('الأعمدة')) { const M = ms('col'); return ratio(M.steel, M.rein, 0.16); }
  if (k.startsWith('الرقاب')) { const M = ms('neck'); return ratio(M.steel, M.rein, 0.16); }
  if (k.startsWith('الميدة')) { const M = ms('beam'); return ratio(M.steel, M.rein, 0.12); }
  if (k.startsWith('الجسور للبلاطات')) return ratio(T.bS, T.bR, 0.13);
  if (k.startsWith('البلاطة المصمتة')) return ratio(T.slab.steel0, T.slab.rein0, 0.11);
  if (k.startsWith('الهردي باتجاه واحد')) return ratio(T.r1.steel0, T.r1.rein0, 0.12);
  if (k.startsWith('الهردي باتجاهين')) return ratio(T.r2.steel0, T.r2.rein0, 0.13);
  return 0.11;
}

function paDefaultRecipe(line) {
  ensurePA();
  const ps = D.paSet;
  const l = line.l || '', u = line.u || '';

  // خرسانة عادية أو صبة أرضيات أو خرسانة الجعم
  if (l.includes('خرسانة عادية') || l.includes('صبة أرضيات') || l.includes('خرسانة الجعم')) {
    return { mix: l.includes('أرضيات') ? ps.mixFloor : ps.mixPlain, resources: [
      { code: ps.cement, norm: 0, mixRole: 'cement' },
      { code: ps.sand, norm: 0, mixRole: 'sand' },
      { code: ps.agg, norm: 0, mixRole: 'agg' },
      { code: 'M-015', norm: 0.18, mixRole: null },
      { code: 'L-005', norm: 1.0, mixRole: null }
    ]};
  }

  // خرسانة مسلحة (شاملة الحديد بنسبة الحصر الفعلية + سلك التربيط + النجارة والحدادة والصبة والرش)
  if (l.includes('خرسانة مسلحة')) {
    const isCol = l.includes('الأعمدة') || l.includes('الرقاب');
    const isSlab = l.includes('البلاطة') || l.includes('الهردي') || l.includes('أعصاب') || l.includes('جسور البلاطات');
    const carp = isCol ? 'L-010' : (isSlab ? 'L-014' : 'L-007');
    const fix  = isCol ? 'L-011' : (isSlab ? 'L-015' : 'L-008');
    const pour = isCol ? 'L-012' : (isSlab ? 'L-016' : 'L-009');
    const stRatio = actualSteelRatio(line);
    return { mix: isCol ? ps.mixCol : ps.mixRein, resources: [
      { code: ps.cement, norm: 0, mixRole: 'cement' },
      { code: ps.sand, norm: 0, mixRole: 'sand' },
      { code: ps.agg, norm: 0, mixRole: 'agg' },
      { code: 'M-015', norm: 0.20, mixRole: null },
      { code: ps.steel, norm: stRatio, mixRole: null, autoSteel: true },
      { code: 'M-014', norm: +(stRatio * 12).toFixed(2), mixRole: null },
      { code: carp, norm: 1.0, mixRole: null },
      { code: fix, norm: 1.0, mixRole: null },
      { code: pour, norm: 1.0, mixRole: null },
      { code: 'L-018', norm: 1.0, mixRole: null }
    ]};
  }

  if (l.includes('بلوك هوردي')) return { mix: null, resources: [{ code: 'M-025', norm: 1.0, mixRole: null }] };
  if (l.includes('حفر')) return { mix: null, resources: [{ code: 'E-001', norm: 0.05, mixRole: null }, { code: 'E-003', norm: 1.0, mixRole: null }, { code: 'L-001', norm: 0.07, mixRole: null }] };

}

function paGetRecipe(line) {
  ensurePA();
  if (!D.pa[line.key]) D.pa[line.key] = paDefaultRecipe(line);
  return D.pa[line.key];
}

function paCalcLine(line) {
  ensurePA();
  const ps = D.paSet;
  const rec = paGetRecipe(line);
  const mixObj = rec.mix ? paMix(rec.mix) : null;
  let directUnit = 0;
  const rows = rec.resources.map(r => {
    const info = paResInfo(r.code);
    let norm = (r.mixRole && mixObj) ? (+mixObj[r.mixRole] || 0) : (+r.norm || 0);
    if (r.autoSteel) norm = actualSteelRatio(line);
    const unitCost = norm * info.price;
    directUnit += unitCost;
    return Object.assign({}, r, { info, norm, unitCost, totalQty: norm * line.q, totalCost: unitCost * line.q });
  });
  const pct = ((+ps.wastage || 0) + (+ps.profit || 0) + (+ps.overhead || 0)) / 100;
  const rate = +ps.rate || 1;
  const finalUnit = directUnit * (1 + pct);
  return {
    rec, rows,
    directUnit: directUnit * rate,
    directTotal: directUnit * line.q * rate,
    finalUnit: finalUnit * rate,
    finalTotal: finalUnit * line.q * rate
  };
}

function paResOpts(selCode) {
  return '<optgroup label="المواد">' +
    PA_CAT.materials.map(m => `<option value="${m.code}" ${m.code===selCode?'selected':''}>${esc(m.group)} — ${esc(m.spec)}</option>`).join('') +
    '</optgroup><optgroup label="العمالة والمعدات">' +
    PA_CAT.labor.map(l => `<option value="${l.code}" ${l.code===selCode?'selected':''}>${esc(l.group)} — ${esc(l.spec)}</option>`).join('') +

}

// Override boq() with informational-line handling (zero double-counting)
boq = function() {
  ensurePA();
  const T = totals(), R = [], ps = D.paSet;
  let G = 0, mi = 0;
  MAIN.forEach(m => {
    if (!D.proj.mains[m.k]) return;
    mi++;
    R.push({ t: 'main', n: mi, l: m.t });
    let st = 0, c = 0;
    m.subs.forEach(s => {
      const L = lines(s, T);
      if (!L.length) return;
      R.push({ t: 'sub', l: MOD[s].t });
      L.forEach(x => {
        const infoOnly = isInfoLine(x);
        let p = 0;
        if (!infoOnly) {
          if (D.px[x.key] !== undefined && D.px[x.key] !== '' && +D.px[x.key] > 0) p = +D.px[x.key];
          else if (ps.autoPrice) p = +paCalcLine(x).finalUnit.toFixed(2);
        }
        const amt = infoOnly ? 0 : (x.q * p);
        st += amt;
        R.push({ t: 'line', n: mi + '.' + (++c), l: x.l, u: x.u, q: x.q, p, key: x.key, amt, infoOnly });
      });
    });
    R.push({ t: 'tot', l: 'إجمالي ' + m.t, amt: st });
    G += st;
  });
  R.push({ t: 'grand', l: 'الإجمالي العام', amt: G });
  return R;
};

// Override boqHTML to clearly show (للمعلومية) for informational lines
boqHTML = function(ro) {
  const R = boq();
  let h = '<table><tr><th>الرقم</th><th>البند</th><th>الوحدة</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>';
  R.forEach((r, i) => {
    if (r.t === 'main') h += `<tr class=mrow><td>${r.n}</td><td colspan=5 class=r>${r.l}</td></tr>`;
    else if (r.t === 'sub') h += `<tr><td></td><td colspan=5 class=r><i>${r.l}</i></td></tr>`;
    else if (r.t === 'line') {
      if (r.infoOnly) {
        h += `<tr style="opacity:0.8"><td>${r.n}</td><td class=r>${r.l} <span class=pa-info>للمعلومية فقط</span></td><td>${r.u}</td><td>${f2(r.q)}</td><td>—</td><td>—</td></tr>`;
      } else {
        h += `<tr><td>${r.n}</td><td class=r>${r.l}</td><td>${r.u}</td><td>${f2(r.q)}</td><td>${ro ? f2(r.p) : `<input type=number step=any data-px="${i}" value="${r.p}" style="width:80px">`}</td><td id="a${i}">${f0(r.amt)}</td></tr>`;
      }
    } else h += `<tr><th colspan=5 class=r>${r.l}</th><th id="a${i}">${f0(r.amt)}</th></tr>`;
  });
  return h + '</table>';
};

// 1. Auto-naming symbols & room presets
const AUTO_SYM = {
  foot:'F', sfoot:'CF', sh:'TB', raft:'RF', col:'C', neck:'N',
  beam:'GB', sbeam:'B', slab:'S', rib:'HS', rib2:'HS2-',
  exc:'EX', bf:'BF', kur:'KW', jaam:'JM', wall:'W', stwall:'SW',
  ext:'EXT', rasif:'RS', rm:'غرفة ', op:'OP'
};
const RM_PRESETS = ['غرفة','صالة','مطبخ','حمام','مجلس','ممر','مكتب','مخزن','تسمية أخرى'];

function nextAutoName(k, customPrefix) {
  const list = D[k] || [];
  const pfx = customPrefix || AUTO_SYM[k] || 'B';
  let maxN = 0;
  list.forEach(x => {
    const nm = String(x.name || '').trim();
    if (nm.startsWith(pfx)) {
      const rest = nm.slice(pfx.length).trim();
      const m = rest.match(/^(\d+)/);
      if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
    }
  });
  return pfx + (maxN + 1);
}

// Single-form state: DRAFT_FORM[k] holds the active form object; EDIT_IDX[k] = -1 (new) or index (editing)
let DRAFT_FORM = {};
let EDIT_IDX = {};

function getDraft(k) {
  if (!DRAFT_FORM[k]) {
    const o = newItem(k);
    o.name = nextAutoName(k);
    DRAFT_FORM[k] = o;
    EDIT_IDX[k] = -1;
  }
  return DRAFT_FORM[k];
}

function resetDraft(k) {
  const o = newItem(k);
  o.name = nextAutoName(k);
  DRAFT_FORM[k] = o;
  EDIT_IDX[k] = -1;
}

// Wrap calc() for upgraded 'kur'
const _v2Calc = calc;
calc = function(k, x) {
  if (k === 'kur') {
    const B = +x.B || 0, C = +x.C || 0, Dd = +x.D || 0, n = +x.n || 1;
    const st = (x.st !== undefined && x.st !== '') ? +x.st : 0.08;
    const rp = (x.rp !== undefined && x.rp !== '') ? +x.rp : 70;
    const faces = +(x.faces || 1);
    const faceArea = B * Dd * n * faces;
    const stones = Math.ceil(faceArea / 0.0625); // 25x25 cm = 0.0625 m2
    const coreT = Math.max(0, C - st * faces);
    const coreVol = B * coreT * Dd * n;
    const jaamVol = coreVol * (rp / 100);
    const concVol = coreVol * ((100 - rp) / 100);
    return { plain: 0, rein: 0, steel: 0, kur: coreVol, kurStones: stones, kurArea: faceArea, kurJaam: jaamVol, kurConc: concVol };
  }
  return _v2Calc(k, x);
};

// Update RL labels for kur results
Object.assign(RL, { kurStones: 'حجر مربوع (حبة)', kurArea: 'مساحة ظهارة م²', kurJaam: 'جعم بطانة م³', kurConc: 'خرسانة بطانة م³' });

// Wrap totals() to include additional backfill (D.bf) and kur concrete/jaam
const _v2Totals = totals;
totals = function() {
  const T = _v2Totals();
  const addBf = sumK(['bf'], 'back');
  T.backAuto = Math.max(0, T.exc - dedSum());
  T.backAdd = addBf;
  T.back = T.backAuto + T.backAdd;
  T.kurStones = sumK(['kur'], 'kurStones');
  T.kurJaam = sumK(['kur'], 'kurJaam');
  T.kurConc = sumK(['kur'], 'kurConc');
  // Include kur concrete in plain concrete materials summary
  if (T.kurConc > 0) {
    const mk = mix(T.kurConc, S.dry, S.mixP);
    T.mp.c += mk.c; T.mp.s += mk.s; T.mp.g += mk.g;
  }
  return T;
};

// Wrap lines() for upgraded 'kur' and 'bf'
const _v2Lines = lines;
lines = function(k, T) {
  if (k === 'kur') {
    const o = [];
    const L = (d, u, q) => { if (q > 0) o.push({ l: d, u, q, key: MOD.kur.t + ' | ' + d }); };
    L('ظهارة كرسي حجر مربوع (25×25)', 'حبة', T.kurStones);
    L('بطانة كرسي حجر (جعم)', 'م³', T.kurJaam);
    L('خرسانة عادية لبطانة الكرسي', 'م³', T.kurConc);
    return o;
  }
  if (k === 'bf') {
    const o = [];
    if (T.backAuto > 0) o.push({ l: 'ردم (من ناتج الحفر)', u: 'م³', q: T.backAuto, key: 'الردم | ردم تلقائي' });
    if (T.backAdd > 0) o.push({ l: 'ردم إضافي (طول×عرض×ارتفاع)', u: 'م³', q: T.backAdd, key: 'الردم | ردم إضافي' });
    return o;
  }
  return _v2Lines(k, T);
};

// 4. Context-Filtered Resources in Price Analysis (no cement inside excavation!)
function allowedGroupsForLine(line) {
  const l = (line && line.l) ? line.l : '';
  if (l.includes('حفر') || l.includes('ردم')) {
    return { mat: ['تربة الردم', 'الماء'], lab: ['الحفر والردم والمعدات'] };
  }
  if (l.includes('خرسانة')) {
    return { mat: ['الإسمنت', 'الرمل', 'الكري', 'حديد التسليح', 'أسلاك تربيط', 'الماء', 'خرسانة جاهزة'], lab: ['الخرسانة العادية', 'القواعد والأساسات', 'الأعمدة والرقاب', 'السقوف والجسور', 'الحفر والردم والمعدات'] };
  }
  if (l.includes('كرسي') || l.includes('جعم') || l.includes('حجر') || l.includes('بلك') || l.includes('هوردي')) {
    return { mat: ['الحجر', 'البلك', 'الإسمنت', 'الرمل', 'الماء'], lab: ['المباني (بلك وحجر)', 'الحفر والردم والمعدات'] };
  }
  if (l.includes('تلابيس')) {
    return { mat: ['الإسمنت', 'الرمل', 'الماء', 'مواد اللياسة'], lab: ['اللياسة والدهان'] };
  }
  if (l.includes('دهان') || l.includes('رشة')) {
    return { mat: ['الدهانات'], lab: ['اللياسة والدهان'] };
  }
  if (l.includes('بلاط') || l.includes('نعلة') || l.includes('رصف')) {
    return { mat: ['البلاط والأرضيات', 'الإسمنت', 'الرمل', 'الكري', 'الماء'], lab: ['البلاط والعزل'] };
  }
  if (l.includes('عزل')) {
    return { mat: ['العزل', 'الإسمنت', 'الرمل', 'الكري'], lab: ['البلاط والعزل'] };
  }
  if (l.includes('نوافذ') || l.includes('أبواب')) {
    return { mat: ['النوافذ والأبواب'], lab: ['المباني (بلك وحجر)', 'الحفر والردم والمعدات'] };
  }
  return null; // fallback: all
}

const _v2PaResOpts = paResOpts;
paResOpts = function(selCode, line) {
  const allow = (line && !PA_SHOW_ALL[line.key]) ? allowedGroupsForLine(line) : null;
  const mats = allow ? PA_CAT.materials.filter(m => allow.mat.includes(m.group) || m.code === selCode) : PA_CAT.materials;
  const labs = allow ? PA_CAT.labor.filter(l => allow.lab.includes(l.group) || l.code === selCode) : PA_CAT.labor;
  let html = '';
  if (mats.length) {
    html += '<optgroup label="المواد المخصصة للبند">' +
      mats.map(m => `<option value="${m.code}" ${m.code===selCode?'selected':''}>${esc(m.group)} — ${esc(m.spec)}</option>`).join('') +
      '</optgroup>';
  }
  if (labs.length) {
    html += '<optgroup label="العمالة والمعدات المخصصة للبند">' +
      labs.map(l => `<option value="${l.code}" ${l.code===selCode?'selected':''}>${esc(l.group)} — ${esc(l.spec)}</option>`).join('') +
      '</optgroup>';
  }
  if (allow) {
    html += '<option value="__SHOW_ALL__">➕ عرض جميع المواد والعمالة...</option>';
  }
  html += '<option value="__NEW_RES__">✨ استحداث مادة / عمالة جديدة...</option>';

};

      PA_CAT.labor.push({ code, group: 'عمالة إضافية', spec: spec.trim(), unit: unit.trim(), price });

// Override bmSteel() with separate top diameter + shrinkage bars (backward-compatible if Ft=0)
bmSteel = function(x) {
  const Ln = Math.max(0, (+x.E || 0) - (+x.M || 0));
  const n = +x.n || 1;
  const dBot = +x.F || 0;
  const dTop = (+x.Ft > 0) ? +x.Ft : dBot;
  const dShk = (+x.dshk > 0) ? +x.dshk : 10;
  const topW = (+x.G || 0) * w(dTop);
  const botW = (+x.H || 0) * w(dBot);
  const bentW = (+x.I || 0) * (Ln + 0.828 * (+x.C || 0)) * w(dBot);
  const shkW = (+x.shk || 0) * Ln * LF() * w(dShk);
  const stW = 2 * ((+x.D || 0) + (+x.C || 0)) * ((+x.K || 0) * Ln * 0.5 + (+x.J || 0) * Ln * 0.5) * w(+x.L || 0);
  return n * (Ln * (topW + botW) * LF() + bentW + shkW + stW);
};

// Update calc() for 'beam' to use the upgraded bmSteel()
const _v3Calc = calc;
calc = function(k, x) {
  if (k === 'beam') {
    const Ln = Math.max(0, (+x.E || 0) - (+x.M || 0));
    return { plain: 0, rein: (+x.C || 0) * (+x.D || 0) * Ln, steel: bmSteel(Object.assign({}, x, { n: 1 })) };
  }
  return _v3Calc(k, x);
};

// Override secCalc() to fix Solid Slab steel formula (V*C*B + H*B*C + top support bars 0.25*span)
const _v3SecCalc = secCalc;
secCalc = function(kind) {
  if (kind !== 'slab') return _v3SecCalc(kind);
  const panels = D.slab || [];
  const beams = (D.sbeam || []).filter(x => (x.ty || 'عادية') === 'عادية' && x.E !== undefined);
  const gross = panels.reduce((s, x) => s + (+x.B || 0) * (+x.C || 0) * (+x.n || 1), 0);
  const foot = beams.reduce((s, x) => s + bmFoot(x), 0);
  const An = Math.max(0, gross - foot);
  const f = gross > 0 ? An / gross : 0;
  const bR = beams.reduce((s, x) => s + bmRein(x), 0);
  const bS = beams.reduce((s, x) => s + bmSteel(x), 0);

  const rein0 = Math.max(0, panels.reduce((s, x) => s + (+x.B || 0) * (+x.C || 0) * (+x.n || 1) * (+x.D || 0), 0)
    - beams.reduce((s, x) => s + bmFoot(x) * (+x.t || 0), 0));

  const steel0 = panels.reduce((s, x) => {
    const B = +x.B || 0, C = +x.C || 0, n = +x.n || 1;
    const dV = +x.G || 0;
    const dH = (+x.Gh > 0) ? +x.Gh : dV;
    const dT = (+x.dt > 0) ? +x.dt : dV;
    // Bottom mesh (full span with lap factor LF)
    const botLong  = (+x.V || 0) * C * B * LF() * w(dV);
    const botTrans = (+x.H || 0) * B * C * LF() * w(dH);
    // Top support bars (0.25 * span per edge: right & left)
    const topLong  = ((+x.tlr || 0) + (+x.tll || 0)) * C * (0.25 * B) * w(dT);
    const topTrans = ((+x.twr || 0) + (+x.twl || 0)) * B * (0.25 * C) * w(dT);
    return s + (botLong + botTrans + topLong + topTrans) * n;
  }, 0) * f;

  return { rein: rein0 + bR, steel: steel0 + bS, blk: 0, rein0, steel0, bR, bS };
};

// =========================================================================
// 1. SMART ENGINEERING AUDITOR (المدقق الهندسي الذكي - أوفلاين 100%)
// =========================================================================
function smartAudit() {
  ensurePA();
  const T = totals(), alerts = [], W = 1 + (S.wst ?? 2.5) / 100;
  const add = (lvl, title, msg) => alerts.push({ lvl, title, msg });

  // A) Check incomplete / zero-dimension items
  let inc = 0;
  MODS.forEach(k => (D[k] || []).forEach(x => {
    if (!Object.values(calc(k, x)).some(v => v > 0)) inc++;
  }));
  if (inc > 0) add('warn', 'بنود ناقصة الأبعاد', `يوجد ${inc} بند بأبعاد غير مكتملة (نتيجتها صفر). راجع البنود المدخلة.`);

  // B) Per-element steel ratio & structural dimension checks
  const checkSteelItem = (k, label, minKg, maxKg) => {
    (D[k] || []).forEach((x, i) => {
      const c = calc(k, x);
      const nm = x.name || (AUTO_SYM[k] + (i + 1));
      if (c.rein > 0 && c.steel > 0) {
        const kgm3 = (c.steel * W * 1000) / c.rein;
        if (kgm3 > maxKg) add('bad', `نسبة حديد مرتفعة في ${label} (${nm})`, `وصلت إلى ${f0(kgm3)} كجم/م³ (المعتاد ${minKg}–${maxKg} كجم/م³) — راجع عدد الأسياخ أو القطر.`);
        else if (kgm3 < minKg) add('warn', `نسبة حديد منخفضة في ${label} (${nm})`, `تساوي ${f0(kgm3)} كجم/م³ (المعتاد ${minKg}–${maxKg} كجم/م³) — تأكد من إدخال التسليح الكامل.`);
      }
      if (k === 'foot' && (+x.D > 0 && +x.D < 0.25)) add('warn', `سماكة قاعدة قليلة (${nm})`, `سماكة القاعدة ${x.D} م أقل من 25 سم المعتادة للقواعد المسلحة.`);
      if ((k === 'col' || k === 'neck') && ((+x.B > 0 && +x.B < 0.20) || (+x.C > 0 && +x.C < 0.20))) add('warn', `بُعد عمود صغير (${nm})`, `أحد أبعاد القطاع أقل من 20 سم — راجع المخطط الإنشائي.`);
    });
  };
  checkSteelItem('foot', 'القواعد المفردة', 45, 140);
  checkSteelItem('sfoot', 'القواعد المشتركة', 60, 160);
  checkSteelItem('col', 'الأعمدة', 70, 220);
  checkSteelItem('neck', 'الرقاب', 70, 220);
  checkSteelItem('beam', 'الميدة', 60, 180);
  checkSteelItem('sbeam', 'جسور البلاطات', 65, 190);

  // Slab overall steel check
  if (T.slab && T.slab.rein0 > 0 && T.slab.steel0 > 0) {
    const skg = (T.slab.steel0 * W * 1000) / T.slab.rein0;
    if (skg > 170) add('bad', 'نسبة حديد البلاطة المصمتة مرتفعة', `تساوي ${f0(skg)} كجم/م³ (المعتاد 60–150 كجم/م³).`);
    else if (skg < 50) add('warn', 'نسبة حديد البلاطة المصمتة منخفضة', `تساوي ${f0(skg)} كجم/م³ — راجع عدد الأسياخ/م والحديد العلوي.`);
  }

  // C) Smart Backfill Deduction Reminders
  if (T.exc > 0) {
    if (T.kurVol > 0 && !D.ded.kr) add('warn', 'خصم الكرسي الحجري غير مفعّل في الردم', `أدخلت كرسياً حجرياً بحجم ${f2(T.kurVol)} م³ ولم تفعّل خصمه من الردم التلقائي.`);
    if (T.jaamVol > 0 && !D.ded.jm) add('warn', 'خصم الأساس الجعم غير مفعّل في الردم', `أدخلت أساساً جعماً بحجم ${f2(T.jaamVol)} م³ ولم تفعّل خصمه من الردم التلقائي.`);
    if (sumK(['foot', 'sfoot'], 'rein') > 0 && !D.ded.fr) add('warn', 'خصم القواعد المسلحة غير مفعّل في الردم', 'أدخلت قواعد مسلحة ولم تفعّل خصمها من الردم في تبويب «الردم».');
    if (sumK(['neck'], 'rein') > 0 && !D.ded.nk) add('warn', 'خصم الرقاب غير مفعّل في الردم', 'أدخلت رقاب أعمدة ولم تفعّل خصمها من الردم.');
  }

  // D) Room height & openings check
  (D.rm || []).forEach((x, i) => {
    if (+x.H > 0 && (+x.H < 2.2 || +x.H > 5.0)) {
      add('warn', `ارتفاع غير معتاد في (${x.name || 'غرفة ' + (i + 1)})`, `الارتفاع المسجل ${x.H} م (المعتاد 2.7–3.6 م).`);
    }
  });
  if ((D.op || []).length > 0 && (D.ext || []).length > 0 && !D.extWin) {
    add('warn', 'خصم النوافذ من التشطيبات الخارجية', 'أدخلت نوافذ في بند الفتحات لكنك لم تفعّل خصمها من التلابيس والدهانات الخارجية.');
  }

  // E) Unit-Price Market Sanity Checks (in base SAR)
  const priced = boq().filter(r => r.t === 'line' && !r.infoOnly);
  const rate = +D.paSet.rate || 1;
  priced.forEach(ln => {
    const upSar = ln.p / rate;
    const l = ln.l || '';
    if (l.includes('جدران بلك') && (upSar > 95 || upSar < 25)) {
      add('warn', `سعر غير معتاد: ${l}`, `السعر المحسوب ${f2(upSar)} ر.س/م² (المعتاد 40–80 ر.س/م²) — راجع سعر البلك أو معدل الاستهلاك.`);
    } else if (l.includes('خرسانة مسلحة') && (upSar > 1400 || upSar < 350)) {
      add('warn', `سعر غير معتاد: ${l}`, `السعر المحسوب ${f2(upSar)} ر.س/م³ (المعتاد 550–1150 ر.س/م³ شامل الحديد) — راجع نسبة الحديد أو الأسعار.`);
    } else if (l.includes('تلابيس') && (upSar > 45 || upSar < 10)) {
      add('warn', `سعر غير معتاد: ${l}`, `السعر المحسوب ${f2(upSar)} ر.س/م² (المعتاد 15–35 ر.س/م²).`);
    }
  });

  if (!alerts.length) {
    add('ok', 'فحص التكامل الهندسي سليم 100%', 'جميع نسب الحديد، الخصومات، الأبعاد، وأسعار الوحدات ضمن النطاق الهندسي والسوقي المعتاد.');
  }
  return alerts;
}

// 2. WHAT-IF SCENARIO COMPARATOR (مقارن البدائل والسيناريوهات - أوفلاين)
// =========================================================================
let SIM_CFG = { wastage: null, overhead: null, profit: null };

function evalScenario(mode, customPcts) {
  ensurePA();
  const ps = D.paSet;
  const priced = boq().filter(r => r.t === 'line' && !r.infoOnly);
  const wPct = customPcts ? customPcts.wastage : (+ps.wastage || 0);
  const oPct = customPcts ? customPcts.overhead : (+ps.overhead || 0);
  const pPct = customPcts ? customPcts.profit : (+ps.profit || 0);
  const mult = 1 + (wPct + oPct + pPct) / 100;
  const rate = +ps.rate || 1;
  let totalDirect = 0;

  priced.forEach(ln => {
    const rec = clone(paGetRecipe(ln));
    const mixObj = rec.mix ? paMix(rec.mix) : null;
    const isConc = (ln.l || '').includes('خرسانة') || (ln.l || '').includes('صبة أرضيات');

    if (mode === 'readymix' && isConc) {
      // Replace site-mixed cement/sand/agg/water + pour labor with central batching concrete
      const rmCode = (rec.mix === '8 أكياس' || rec.mix === '1:1.5:3') ? 'M-018' : ((rec.mix === '5 أكياس' || rec.mix === '6 أكياس' || rec.mix === '1:2:4') ? 'M-016' : 'M-017');
      rec.resources = rec.resources.filter(r => !r.mixRole && !['M-015', 'L-005', 'L-009', 'L-012', 'L-016'].includes(r.code));
      rec.resources.unshift({ code: rmCode, norm: 1.0, mixRole: null });
    } else if (mode === 'saudi_steel') {
      rec.resources.forEach(r => { if (['M-010', 'M-011', 'M-013'].includes(r.code)) r.code = 'M-012'; });
    } else if (mode === 'econ_steel') {
      rec.resources.forEach(r => { if (['M-010', 'M-012', 'M-013'].includes(r.code)) r.code = 'M-011'; });
    } else if (mode === 'hadramout_cem') {
      rec.resources.forEach(r => { if (['M-001', 'M-003'].includes(r.code)) r.code = 'M-002'; });
    }

    let directU = 0;
    rec.resources.forEach(r => {
      const info = paResInfo(r.code);
      let norm = (r.mixRole && mixObj) ? (+mixObj[r.mixRole] || 0) : (+r.norm || 0);
      if (r.autoSteel) norm = actualSteelRatio(ln);
      directU += norm * info.price;
    });
    totalDirect += directU * ln.q * rate;
  });

  return { direct: totalDirect, final: totalDirect * mult };
}

  ensurePA();
  if (mode === 'saudi_steel') {

    { k: 'foot',  kw: ['قواعد', 'قاعدة', 'قاعده', 'f'] },
    { k: 'sh',    kw: ['شداد', 'شدادات', 'tb'] },
    { k: 'raft',  kw: ['حصيرة', 'حصيره', 'لبشة', 'لبشه', 'rf'] },
    { k: 'neck',  kw: ['رقاب', 'رقبة', 'رقبه'] },
    { k: 'col',   kw: ['أعمدة', 'اعمده', 'عمود', 'أعمده'] },
    { k: 'sbeam', kw: ['جسر سقف', 'جسور سقف', 'جسر بلاطة', 'جسور البلاطات', 'كمرة', 'كمرات'] },
    { k: 'beam',  kw: ['ميدة', 'ميده', 'ميدات', 'جسور أرضية', 'gb'] },
    { k: 'rib2',  kw: ['هوردي اتجاهين', 'هردي اتجاهين', 'هوردي باتجاهين'] },
    { k: 'rib',   kw: ['هوردي', 'هردي', 'أعصاب', 'اعصاب'] },
    { k: 'slab',  kw: ['بلاطة', 'بلاطه', 'سقف', 'بلاطات'] },
    { k: 'exc',   kw: ['حفر', 'حفريات'] },
    { k: 'bf',    kw: ['ردم', 'دفان', 'دفن'] },
    { k: 'kur',   kw: ['كرسي', 'الكرسي'] },
    { k: 'jaam',  kw: ['جعم', 'الأساس الجعم', 'اساس جعم'] },
    { k: 'stwall',kw: ['بناء حجر', 'جدار حجر', 'حجر'] },
    { k: 'wall',  kw: ['بلك', 'بلوك', 'جدار', 'مباني'] },
    { k: 'rm',    kw: ['غرفة', 'غرفه', 'صالة', 'صاله', 'مطبخ', 'حمام', 'مجلس', 'ممر', 'مكتب', 'مخزن'] },
    { k: 'op',    kw: ['نافذة', 'نافذه', 'شباك', 'باب', 'أبواب', 'ابواب'] },
  ];

  const lower = txt.toLowerCase();
  let mod = null;
  for (const r of rules) {
    if (r.kw.some(w => lower.includes(w))) { mod = r.k; break; }
  }
  // Fallback: if currently inside a module in items view, use it
  if (!mod && CUR.v === 'items' && CUR.s && MOD[CUR.s] && MOD[CUR.s].f.length) mod = CUR.s;
  if (!mod) return { err: 'لم أتعرف على نوع البند. ابدأ بكلمة مثل: قواعد، أعمدة، رقاب، ميدة، بلاطة، حفر، ردم، كرسي، جعم، بلك، غرفة، صالة.' };

  // Extract explicit count after "عدد" or "العدد" or "x"
  let count = null;
  let clean = txt.replace(/(?:العدد|عدد)\s*[:=]?\s*(\d+(?:\.\d+)?)/g, (_, n) => { count = parseFloat(n); return ' '; });

  // Extract symbol/name like F1, C2, GB1, غرفة 1
  let customName = null;
  const symMatch = clean.match(/\b([A-Za-z]{1,3}\d+)\b/);
  if (symMatch) {
    customName = symMatch[1].toUpperCase();
    clean = clean.replace(symMatch[0], ' ');
  } else if (mod === 'rm') {
    const rmWord = ['غرفة','غرفه','صالة','صاله','مطبخ','حمام','مجلس','ممر','مكتب','مخزن'].find(w => clean.includes(w));
    if (rmWord) customName = nextAutoName('rm', rmWord.replace('ه', 'ة') + ' ');
  }

  // Extract remaining numbers in order
  const nums = (clean.match(/\d+(?:\.\d+)?/g) || []).map(Number);
  if (nums.length < 2) return { err: 'يرجى ذكر الأبعاد الرقمية (مثلاً: 1.8 1.8 0.5 عدد 8).' };

  const item = newItem(mod);
  item.name = customName || nextAutoName(mod);

  if (['foot', 'sfoot', 'sh', 'raft', 'col', 'neck', 'exc', 'bf', 'kur', 'jaam', 'slab', 'rib', 'rib2'].includes(mod)) {
    item.B = nums[0] || 0;
    item.C = nums[1] || 0;
    item.D = nums[2] || 0;
    const cntVal = count !== null ? count : (nums[3] !== undefined ? nums[3] : 1);
    if (mod === 'foot') { item.J = cntVal; if (!item.E) item.E = 6; if (!item.F) item.F = 6; if (!item.I) item.I = 14; }
    else if (mod === 'col' || mod === 'neck') { item.E = cntVal; if (!item.G) item.G = 6; if (!item.H) item.H = 16; if (!item.I) item.I = 6; if (!item.J) item.J = 8; if (!item.F) item.F = 0.8; }
    else { item.n = cntVal; }
  } else if (mod === 'beam' || mod === 'sbeam') {
    // Support either (L, b, h) or (h, b, L): largest number is length E
    const d3 = [nums[0] || 0, nums[1] || 0, nums[2] || 0];
    const maxV = Math.max(...d3);
    if (d3[0] === maxV && maxV > 1.5) { item.E = d3[0]; item.D = d3[1]; item.C = d3[2]; }
    else { item.C = d3[0]; item.D = d3[1]; item.E = d3[2]; }
    item.n = count !== null ? count : (nums[3] || 1);
    if (!item.G) item.G = 2; if (!item.H) item.H = 3;
  } else if (mod === 'wall' || mod === 'stwall') {
    item.L = nums[0] || 0; item.H = nums[1] || 0;
    if (mod === 'stwall' && nums[2]) item.T = nums[2];
    item.n = count !== null ? count : 1;
  } else if (mod === 'rm') {
    item.L = nums[0] || 0; item.W = nums[1] || 0; item.H = nums[2] || 3.0;
    item.n = count !== null ? count : 1;
    // Enable common interior finishes by default for quick rooms
    item.pw = true; item.pc = true; item.pdw = true; item.pdc = true; item.tf = true; item.sk = true;
  } else if (mod === 'op') {
    item.ty = lower.includes('باب') ? 'باب' : 'نافذة';
    item.W = nums[0] || 0; item.H = nums[1] || 0;
    item.n = count !== null ? count : (nums[2] || 1);
  }

  return { mod, item };
}

  return `<div class=ai-box>
    <div class=tools style="justify-content:space-between;margin-top:0;margin-bottom:6px">
      <b>⚡ الإدخال السريع الذكي (نصي أو صوتي)</b>
      <span class=tag>يعمل أوفلاين</span>
    </div>
    <div class=ai-row>
      <input id="smartCmdInput" placeholder="مثال: قواعد F1 1.8 1.8 0.5 عدد 8  أو  غرفة 4.5 4 3.2 عدد 2">
      <button type="button" class=ai-mic id="smartMicBtn" title="إملاء صوتي">🎤</button>
      <button type="button" class=btn id="smartRunBtn">ترحيل فوري</button>
    </div>
    <small style="color:var(--mut);display:block;margin-top:5px">اكتب البند وأبعاده بجملة واحدة أو استخدم ميكروفون لوحة المفاتيح، وسيُضاف مباشرة لبنده الصحيح.</small>
  </div>`;
}

// =========================================================================
// 4. SMART ENGINEERING TAB (تبويب الذكاء الهندسي المدمج)
// =========================================================================
function smartHTML() {
  ensurePA();
  const ps = D.paSet, cur = esc(ps.cur || 'ر.س');
  if (SIM_CFG.wastage === null) { SIM_CFG.wastage = +ps.wastage; SIM_CFG.overhead = +ps.overhead; SIM_CFG.profit = +ps.profit; }

  const audits = smartAudit();
  const base = evalScenario('base');
  const scenarios = [
    { id: 'readymix',      title: 'خرسانة جاهزة (خلاطة مركزية)', desc: 'استبدال الصب اليدوي بالخرسانة الجاهزة في كل بنود الخرسانة', res: evalScenario('readymix') },
    { id: 'saudi_steel',   title: 'حديد سعودي جريد 60 (سابك/الراجحي)', desc: 'ترقية تسليح المشروع للحديد السعودي جريد 60', res: evalScenario('saudi_steel') },
    { id: 'econ_steel',    title: 'حديد تركي جريد 40 (خيار اقتصادي)', desc: 'احتساب التكلفة باستخدام حديد تركي جريد 40', res: evalScenario('econ_steel') },
    { id: 'hadramout_cem', title: 'إسمنت حضرموت (بديل محلي)', desc: 'استبدال الإسمنت الحالي بإسمنت حضرموت في جميع البنود', res: evalScenario('hadramout_cem') },
  ];
  const simRes = evalScenario('base', SIM_CFG);
  const simDiff = simRes.final - base.final;

  let h = quickInputBoxHTML();

  // Auditor Card
  h += `<div class=card>
    <b>1. المدقق الهندسي الذكي (${audits.length} فحص)</b>
    <p class=note>يفحص نسب الحديد لكل عنصر على حدة، وخصومات الردم، والأبعاد الهندسية، وأسعار الوحدات مقارنة بمتوسط السوق.</p>
    ${audits.map(a => `<div class="aud-item ${a.lvl}"><b>${a.lvl === 'ok' ? '✔' : (a.lvl === 'bad' ? '⛔' : '⚠')} ${esc(a.title)}:</b> ${esc(a.msg)}</div>`).join('')}
  </div>`;

  // What-If Comparator Card
  h += `<div class=card>
    <b>2. مقارن البدائل والسيناريوهات (What-If)</b>
    <p class=note>التكلفة النهائية الحالية للمشروع: <b>${f0(base.final)} ${cur}</b> (مباشر: ${f0(base.direct)} ${cur}). قارن البدائل بضغطة زر قبل تقديم العرض:</p>
    <div style="overflow-x:auto"><table>
      <tr><th class=r>السيناريو البديل</th><th>الإجمالي النهائي</th><th>الفارق</th><th>إجراء</th></tr>
      ${scenarios.map(sc => {
        const diff = sc.res.final - base.final;
        const pct = base.final > 0 ? (diff / base.final) * 100 : 0;
        const cls = diff > 0 ? 'sc-diff-pos' : (diff < 0 ? 'sc-diff-neg' : '');
        const sign = diff > 0 ? '+' : '';
        return `<tr>
          <td class=r><b>${sc.title}</b><br><small style="color:var(--mut)">${sc.desc}</small></td>
          <td><b>${f0(sc.res.final)} ${cur}</b></td>
          <td class="${cls}">${sign}${f0(diff)} ${cur}<br><small>(${sign}${f2(pct)}%)</small></td>
          <td><button class=ghost style="padding:5px 9px;font-size:12px" data-apply-sc="${sc.id}">اعتماد</button></td>
        </tr>`;
      }).join('')}
    </table></div>
  </div>`;

  // Interactive Markup Simulator Card
  h += `<div class=card>
    <b>3. محاكي النسب المالية الفوري (الهدر / الإشراف / الأرباح)</b>
    <div class=grid>
      <label>نسبة الهدر %<input type=number step=0.5 data-sim="wastage" value="${SIM_CFG.wastage}"></label>
      <label>الإشراف والإدارية %<input type=number step=0.5 data-sim="overhead" value="${SIM_CFG.overhead}"></label>
      <label>نسبة الأرباح %<input type=number step=0.5 data-sim="profit" value="${SIM_CFG.profit}"></label>
    </div>
    <p class=res>إجمالي المحاكاة: <b>${f0(simRes.final)} ${cur}</b> &nbsp;|&nbsp; الفارق عن الوضع الحالي: <span class="${simDiff > 0 ? 'sc-diff-pos' : 'sc-diff-neg'}">${simDiff > 0 ? '+' : ''}${f0(simDiff)} ${cur}</span></p>
    <div class=tools style="margin-bottom:0">
      <button class=btn data-apply-sim=1>اعتماد نسب المحاكاة للمشروع</button>
    </div>
  </div>`;

  return h;
}

// Add 'الذكاء الهندسي' tab to project navigation & inject Quick Input into itemsHTML
const _v5Nav = nav;
nav = function() {
  let T = [];
  if (CUR.v === 'home') { $('#nav').innerHTML = ''; return; }
  if (['proj', 'items', 'pa', 'smart', 'sum'].includes(CUR.v))
    T = [['home', 'الرئيسية'], ['proj', 'المشروع']].concat(CUR.started ? [['items', 'البنود'], ['pa', 'تحليل الأسعار'], ['smart', 'الذكاء الهندسي'], ['sum', 'الخلاصة']] : []);
  else
    T = [['home', 'الرئيسية'], ['drafts', 'المسودات'], ['prices', 'أسعار المواد والعمالة'], ['set', 'الإعدادات']];
  $('#nav').innerHTML = T.map(([k, t]) => `<button data-tab="${k}" class="${k === CUR.v ? 'on' : ''}">${t}</button>`).join('');
};

const _v5ItemsHTML = itemsHTML;
itemsHTML = function() {
  return quickInputBoxHTML() + _v5ItemsHTML();
};

render = function() {
  ensurePA();
  nav();
  const V = { home: homeHTML, drafts: draftsHTML, set: setHTML, proj: projHTML, items: itemsHTML, pa: paHTML, smart: smartHTML, sum: sumHTML };
  $('#main').innerHTML = V[CUR.v]();
  updRes();
  updPx();
};

// Event Handlers for Smart Quick Input, Voice Mic, and Scenarios
let _recog = null;
document.body.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;

  if (t.id === 'smartRunBtn') {
    const inp = $('#smartCmdInput');
    const parsed = parseSmartCommand(inp ? inp.value : '');
    if (parsed.err) { toast(parsed.err); return; }
    D[parsed.mod].push(parsed.item);
    resetDraft(parsed.mod);
    save();
    if (inp) inp.value = '';
    render();
    toast(`تمت إضافة ${parsed.item.name} في «${MOD[parsed.mod].t}»`);
    return;
  }

  if (t.id === 'smartMicBtn') {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('استخدم زر الميكروفون في لوحة مفاتيح الجوال للإملاء الصوتي'); return; }
    if (_recog) { try { _recog.stop(); } catch (err) {} _recog = null; t.classList.remove('rec'); return; }
    _recog = new SR();
    _recog.lang = 'ar-SA';
    _recog.interimResults = false;
    t.classList.add('rec');
    toast('تحدث الآن... (مثال: قواعد F1 1.8 1.8 0.5 عدد 8)');
    _recog.onresult = ev => {
      const spoken = ev.results[0][0].transcript;
      const inp = $('#smartCmdInput');
      if (inp) inp.value = spoken;
      t.classList.remove('rec'); _recog = null;
    };
    _recog.onerror = () => { t.classList.remove('rec'); _recog = null; toast('تعذّر الالتقاط الصوتي — يمكنك استخدام ميكروفون الكيبورد'); };
    _recog.onend = () => { t.classList.remove('rec'); _recog = null; };
    _recog.start();
    return;
  }

  if (t.dataset.applySc) {
    if (confirm('تطبيق هذا السيناريو على تحليل أسعار المشروع الحالي؟')) applyScenario(t.dataset.applySc);
    return;
  }

  if (t.dataset.applySim) {
    D.paSet.wastage = +SIM_CFG.wastage || 0;
    D.paSet.overhead = +SIM_CFG.overhead || 0;
    D.paSet.profit = +SIM_CFG.profit || 0;
    save(); render(); toast('تم اعتماد نسب المحاكاة للمشروع');
    return;
  }
});

document.body.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sim) {
    SIM_CFG[t.dataset.sim] = num(t.value);
    if (CUR.v === 'smart') render();
    return;
  }
});
